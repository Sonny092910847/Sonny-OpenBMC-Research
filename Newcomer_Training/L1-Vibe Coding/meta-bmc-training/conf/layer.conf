# === L1: BMC Training Layer START ===
# Layer configuration for BMC L1 Training
# Author: Sonny Chu (835051)

BBPATH .= ":${LAYERDIR}"
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-bmc-training"
BBFILE_PATTERN_meta-bmc-training = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-bmc-training = "10"

# IMPORTANT: 使用正確的設定
# LAYERDEPENDS 使用 phosphor-layer（不是 meta-phosphor）
# LAYERSERIES_COMPAT 使用 mickledore（不是 nanbield）
LAYERDEPENDS_meta-bmc-training = "core phosphor-layer"
LAYERSERIES_COMPAT_meta-bmc-training = "mickledore"
# === L1: BMC Training Layer END ===
